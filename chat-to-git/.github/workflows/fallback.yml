name: Chat-to-Git Fallback

on:
  repository_dispatch:
    types: [make-it-so]

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Execute fallback request
        env:
          REQUEST_ID: webhook-${{ github.run_id }}
          HUMAN_INTENT: ${{ toJson(github.event.client_payload.intent) }}
          TRANSPORT: webhook-to-github
        run: python chat-to-git/scripts/runner.py
      - name: Upload fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat-to-git-webhook-${{ github.run_id }}
          path: state/
